{# Каркас страниц входа: вход по паролю (login.html) и страницы единого входа (apps/sso_client). #}
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block head %}{% endblock %}
    <title>{% block title %}Вход{% endblock %} — Отчёты МТО</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
<div class="login-wrap">
    <div class="login-box">
        <div class="login-top">
            <div class="login-icon">
                <svg viewBox="0 0 24 24"><path d="M3 3h18v4H3zm0 6h11v4H3zm0 6h14v4H3z"/></svg>
            </div>
            <div class="login-title">
                Отчёты МТО
                <span>{% block subtitle %}Единый вход{% endblock %}</span>
            </div>
        </div>
        <div class="login-body">
            {% block content %}{% endblock %}
        </div>
        <div class="login-footer">Отчёты МТО</div>
    </div>
</div>
</body>
</html>
