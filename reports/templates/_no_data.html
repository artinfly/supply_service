<div class="table-container" style="padding:48px 32px;text-align:center">
    <div style="opacity:.35;margin-bottom:14px">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L10 5H5a2 2 0 0 0-2 2z"/>
            <path d="M9 13h6"/>
        </svg>
    </div>
    <div style="font-size:15px;font-weight:600;margin-bottom:6px">Нет данных</div>
    <div style="color:var(--text-muted);font-size:13px;max-width:420px;margin:0 auto">
        {{ no_data_hint }}
    </div>
    {% if is_operator %}
    <a href="{% url 'upload_excel' %}" class="btn-orange"
       style="display:inline-block;margin-top:20px;text-decoration:none">Загрузить данные</a>
    {% endif %}
</div>
